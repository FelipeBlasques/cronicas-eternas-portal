<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caderno · Crônicas Eternas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Grenze+Gotisch:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../marcas.css">
  <link rel="stylesheet" href="caderno.css">
  <script src="../comum.js" defer></script>
  <script src="../marcas.js" defer></script>
  <script src="caderno.js" defer></script>
</head>
<body class="com-barra" data-pagina="caderno" data-raiz="../">

  <!-- ============ Cenário: arte de fundo, névoa e cinzas ============ -->
  <div class="cenario" aria-hidden="true">
    <div class="cenario__arte"></div>
    <div class="cenario__nevoa"></div>
    <canvas id="cinzas" class="cenario__cinzas"></canvas>
    <div class="cenario__vinheta"></div>
    <div class="cenario__grao"></div>
  </div>

  <!-- ============ Desenhos usados pela página ============ -->
  <svg class="simbolos" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="vigia" viewBox="0 0 24 24"><path d="M2.5 12C5.5 7.4 8.6 5.6 12 5.6S18.5 7.4 21.5 12C18.5 16.6 15.4 18.4 12 18.4S5.5 16.6 2.5 12Z"/><circle cx="12" cy="12" r="3.2"/><path d="M12 1.8V3.4M12 20.6V22.2"/></symbol>
      <!-- A pasta aberta ou fechada, na árvore -->
      <symbol id="icone-seta" viewBox="0 0 24 24"><path d="M9 5.5l6.5 6.5L9 18.5"/></symbol>
      <!-- Compartilhada com contas e com link público (só a dona vê) -->
      <symbol id="icone-pessoas" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19.5c0-3.4 2.7-5.6 6-5.6s6 2.2 6 5.6M15.5 4.9a3.2 3.2 0 0 1 0 6.2M17.5 13.9c2.1.6 3.5 2.6 3.5 5.6"/></symbol>
      <symbol id="icone-elo" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.2 1.2M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/></symbol>
      <!-- Nas compartilhadas: pode ver ou pode editar -->
      <symbol id="icone-olho" viewBox="0 0 24 24"><path d="M2.5 12C5.5 7.4 8.6 5.6 12 5.6S18.5 7.4 21.5 12C18.5 16.6 15.4 18.4 12 18.4S5.5 16.6 2.5 12Z"/><circle cx="12" cy="12" r="3.2"/></symbol>
      <symbol id="icone-lapis" viewBox="0 0 24 24"><path d="M15.5 4.5l4 4L8.5 19.5H4.5v-4ZM13 7l4 4"/></symbol>
    </defs>
  </svg>

  <!-- ============ Cabeçalho ============ -->
  <header id="topo" class="topo">
    <a class="topo__marca topo__marca--link" href="../">Crônicas Eternas</a>

    <p id="status" class="status" role="status" aria-live="polite">
      <svg class="status__vigia" aria-hidden="true"><use href="#vigia"/></svg>
      <span id="status-texto">Consultando o servidor…</span>
    </p>

    <nav class="topo__conta" aria-label="Sua conta">
      <span id="nome-conta" class="topo__nome"></span>
      <span id="cargo-conta" class="topo__cargo" hidden></span>
      <button id="botao-sair" class="botao botao--leve" type="button">Sair</button>
    </nav>
  </header>

  <!-- ============ Barra lateral (montada pelo comum.js) ============ -->
  <nav class="barra-lateral" aria-label="Páginas do grupo"></nav>

  <!-- ============ A página: a lateral do caderno e a nota aberta ============ -->
  <main id="pagina" class="pagina-caderno" hidden>
    <aside id="lateral" class="lateral" aria-labelledby="titulo-caderno">
      <div class="lateral__cabeca">
        <h2 id="titulo-caderno" class="lateral__titulo">Caderno</h2>
        <!-- Só o administrador: de quem é o caderno que ele lê -->
        <label id="campo-conta" class="campo lateral__conta" hidden>
          <span class="campo__rotulo">Caderno de:</span>
          <select id="conta-escolhida"></select>
        </label>
      </div>

      <!-- Só quem tem caderno -->
      <div id="lateral-acoes" class="lateral__acoes" hidden>
        <button id="botao-nova-nota" class="botao botao--principal botao--brasa lateral__nova" type="button">+ Nota</button>
        <button id="botao-nova-pasta" class="botao botao--leve" type="button">+ Pasta</button>
        <button id="botao-nota-de-hoje" class="botao botao--leve" type="button">Nota de hoje</button>
      </div>

      <label class="campo lateral__busca">
        <span class="sr">Buscar nas notas</span>
        <input id="busca" type="search" placeholder="Buscar nas notas" autocomplete="off" spellcheck="false" disabled>
      </label>

      <section id="secao-fixadas" class="lateral__secao" aria-labelledby="titulo-fixadas" hidden>
        <h3 id="titulo-fixadas" class="lateral__subtitulo">Fixadas</h3>
        <ul id="lista-fixadas" class="lateral__lista"></ul>
      </section>

      <!-- A árvore do caderno (montada pelo caderno.js) -->
      <div id="arvore-caderno" class="lateral__arvore"></div>

      <!-- Uma seção para cada conta que compartilhou algo -->
      <div id="secoes-compartilhadas" class="lateral__compartilhadas"></div>

      <details id="secao-etiquetas" class="lateral__secao lateral__etiquetas" hidden>
        <summary class="lateral__subtitulo">Etiquetas</summary>
        <div id="lista-etiquetas" class="lateral__placas"></div>
      </details>

      <p id="espaco-imagens" class="lateral__pe" hidden></p>
    </aside>

    <!-- A nota aberta (#nota-<id> no endereço), ou o convite para escolher uma -->
    <section id="area-nota" class="area-nota" tabindex="-1" aria-label="Nota"></section>
  </main>

  <!-- ============ Aviso e confirmação ============ -->
  <dialog id="dialogo-aviso" class="dialogo">
    <form method="dialog">
      <h2 id="aviso-titulo" class="dialogo__titulo"></h2>
      <p id="aviso-texto" class="dialogo__texto"></p>
      <div class="dialogo__acoes">
        <button id="aviso-cancelar" class="botao botao--leve" value="cancelar" hidden></button>
        <button id="aviso-confirmar" class="botao botao--principal" value="confirmar">Entendi</button>
      </div>
    </form>
  </dialog>

  <div id="aviso-rapido" class="aviso-rapido" role="status" aria-live="polite" hidden></div>

  <!-- ============ Só na prévia ============ -->
  <details id="simulacao" class="simulacao" hidden>
    <summary id="simulacao-resumo">Prévia</summary>
    <label class="campo">
      <span class="campo__rotulo">Ver a página como</span>
      <select id="sim-cargo">
        <option value="jogador">Neia (jogadora)</option>
        <option value="editor">Takezo (editor)</option>
        <option value="admin">Mestre (administrador)</option>
      </select>
    </label>
    <button id="sim-restaurar" class="botao botao--leve" type="button">Restaurar os exemplos</button>
    <p class="simulacao__nota">Só existe na prévia. Os cadernos são exemplos: o da Neia tem o "Guia das marcas", sessões, diário e notas compartilhadas; o do Takezo compartilha teorias com ela.</p>
  </details>
</body>
</html>
