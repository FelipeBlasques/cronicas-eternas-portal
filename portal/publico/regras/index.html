<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regras da casa · Crônicas Eternas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Grenze+Gotisch:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="regras.css">
  <script src="../comum.js" defer></script>
  <script src="regras.js" defer></script>
</head>
<body class="com-barra" data-pagina="regras" data-raiz="../">

  <!-- ============ Cenário: arte de fundo, névoa e cinzas ============ -->
  <div class="cenario" aria-hidden="true">
    <div class="cenario__arte"></div>
    <div class="cenario__nevoa"></div>
    <canvas id="cinzas" class="cenario__cinzas"></canvas>
    <div class="cenario__vinheta"></div>
    <div class="cenario__grao"></div>
  </div>

  <!-- ============ Desenhos usados pela página ============ -->
  <svg class="simbolos" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="vigia" viewBox="0 0 24 24"><path d="M2.5 12C5.5 7.4 8.6 5.6 12 5.6S18.5 7.4 21.5 12C18.5 16.6 15.4 18.4 12 18.4S5.5 16.6 2.5 12Z"/><circle cx="12" cy="12" r="3.2"/><path d="M12 1.8V3.4M12 20.6V22.2"/></symbol>
      <symbol id="icone-lupa" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.4 15.4L21 21"/></symbol>
      <symbol id="icone-corrente" viewBox="0 0 24 24"><rect x="8.5" y="1.5" width="7" height="8.5" rx="3.5"/><rect x="8.5" y="14" width="7" height="8.5" rx="3.5"/><path d="M4.5 12h3M16.5 12h3"/></symbol>
      <symbol id="divisor" viewBox="0 0 320 20">
        <path d="M0 10H132M188 10H320M132 10L142 6L150 10L142 14ZM188 10L178 6L170 10L178 14Z"/>
        <path d="M160 2L168 10L160 18L152 10Z"/>
      </symbol>
    </defs>
  </svg>

  <!-- ============ Cabeçalho ============ -->
  <header id="topo" class="topo">
    <a class="topo__marca topo__marca--link" href="../">Crônicas Eternas</a>

    <p id="status" class="status" role="status" aria-live="polite">
      <svg class="status__vigia" aria-hidden="true"><use href="#vigia"/></svg>
      <span id="status-texto">Consultando o servidor…</span>
    </p>

    <nav class="topo__conta" aria-label="Sua conta">
      <span id="nome-conta" class="topo__nome"></span>
      <span id="cargo-conta" class="topo__cargo" hidden></span>
      <button id="botao-sair" class="botao botao--leve" type="button">Sair</button>
    </nav>
  </header>

  <!-- ============ Barra lateral (montada pelo comum.js) ============ -->
  <nav class="barra-lateral" aria-label="Páginas do grupo"></nav>

  <!-- ============ A página ============ -->
  <main id="pagina" class="pagina-regras" hidden>
    <div class="cabeca-regras">
      <div class="cabeca-regras__texto">
        <h1 class="cabeca-regras__titulo">Regras da casa</h1>
        <p class="cabeca-regras__sub">O que o grupo combinou à mesa.</p>
      </div>
      <span class="cabeca-regras__regua" aria-hidden="true"></span>
    </div>

    <!-- Filtros -->
    <div class="filtros-regras">
      <label class="filtro-campo filtro-campo--busca">
        <svg aria-hidden="true"><use href="#icone-lupa"/></svg>
        <span class="sr">Buscar nas regras</span>
        <input id="filtro-busca" type="search" placeholder="Buscar" autocomplete="off" spellcheck="false">
      </label>
      <div id="filtro-mesas" class="filtros-regras__mesas" role="group" aria-label="Mesas"></div>
      <label class="caixa filtros-regras__revogadas">
        <input id="filtro-revogadas" type="checkbox">
        <span class="caixa__marca" aria-hidden="true"></span>
        <span>Mostrar revogadas</span>
      </label>
    </div>

    <p id="faixa-novidades" class="faixa-novidades" hidden></p>

    <!-- No celular, o sumário vira esta lista -->
    <label class="filtro-campo sumario-celular">
      <span class="sr">Ir para o capítulo</span>
      <select id="sumario-celular"></select>
    </label>

    <div class="regras-corpo">
      <nav id="sumario" class="sumario" aria-label="Capítulos">
        <p class="sumario__titulo">Capítulos</p>
        <ol id="sumario-lista" class="sumario__lista"></ol>
      </nav>

      <div id="capitulos" class="capitulos"></div>
    </div>
  </main>

  <!-- ============ Aviso e confirmação ============ -->
  <dialog id="dialogo-aviso" class="dialogo">
    <form method="dialog">
      <h2 id="aviso-titulo" class="dialogo__titulo"></h2>
      <p id="aviso-texto" class="dialogo__texto"></p>
      <div class="dialogo__acoes">
        <button id="aviso-cancelar" class="botao botao--leve" value="cancelar" hidden></button>
        <button id="aviso-confirmar" class="botao botao--principal" value="confirmar">Entendi</button>
      </div>
    </form>
  </dialog>

  <div id="aviso-rapido" class="aviso-rapido" role="status" aria-live="polite" hidden></div>

  <!-- ============ Só na prévia ============ -->
  <details id="simulacao" class="simulacao" hidden>
    <summary id="simulacao-resumo">Prévia</summary>
    <label class="campo">
      <span class="campo__rotulo">Ver a página como</span>
      <select id="sim-cargo">
        <option value="admin">Administrador (mestre)</option>
        <option value="jogador">Jogador (Neia)</option>
      </select>
    </label>
    <button id="sim-restaurar" class="botao botao--leve" type="button">Restaurar os exemplos</button>
    <p class="simulacao__nota">Só existe na prévia. As regras são exemplos para ver o visual. As novidades somem depois da primeira visita de cada conta; "Restaurar os exemplos" traz de volta.</p>
  </details>
</body>
</html>
