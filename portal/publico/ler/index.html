<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Crônicas Eternas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Grenze+Gotisch:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../marcas.css">
  <link rel="stylesheet" href="ler.css">
  <script src="../comum.js" defer></script>
  <script src="../marcas.js" defer></script>
  <script src="ler.js" defer></script>
</head>
<body data-pagina="ler" data-raiz="../">

  <!-- ============ Cenário: arte de fundo, névoa e cinzas ============ -->
  <div class="cenario" aria-hidden="true">
    <div class="cenario__arte"></div>
    <div class="cenario__nevoa"></div>
    <canvas id="cinzas" class="cenario__cinzas"></canvas>
    <div class="cenario__vinheta"></div>
    <div class="cenario__grao"></div>
  </div>

  <!-- ============ Cabeçalho: só o nome do portal, com o link para ele ============ -->
  <header id="topo" class="topo">
    <a class="topo__marca topo__marca--link" href="../">Crônicas Eternas</a>
  </header>

  <!-- ============ A nota do link público (montada pelo ler.js) ============ -->
  <main id="leitura" class="leitura">
    <p class="leitura__aviso" role="status">Abrindo a nota…</p>
  </main>

</body>
</html>
